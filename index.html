<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3559a8">
  <meta name="description" content="Prancha de comunica��o aumentativa e alternativa para crian�as.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <title>ComuniCAA Kids</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <section id="voice-loading" class="voice-loading" role="status" aria-live="polite">
    <span class="voice-loading__icon" aria-hidden="true">🔊</span>
    <p>Preparando a voz...</p>
    <span class="voice-loading__bar" aria-hidden="true"></span>
  </section>
  <button type="button" id="unlock-zone" class="unlock-zone" aria-label="Mostrar botão de desbloqueio"></button>
  <main aria-label="Palavras para comunicar">
    <header class="page-header">
      <div id="header-title" hidden>
        <h1>Minha Prancha</h1>
        <p>Toque em uma imagem para falar.</p>
      </div>
      <div class="header-controls">
        <div class="header-actions" id="header-actions" hidden>
        <button type="button" id="copy-link" class="toolbar-button secondary-button">Copiar link</button>
        <button type="button" id="reset-board" class="toolbar-button reset-button">Restauração padrão</button>
        <button type="button" id="edit-toggle" class="toolbar-button" aria-pressed="false">Editar botões</button>
        </div>
        <button type="button" id="admin-lock" class="lock-button" aria-label="Segure para desbloquear os controles" aria-pressed="false" title="Segure para desbloquear os controles" hidden>🔒</button>
      </div>
    </header>
    <section id="word-editor" class="editor" aria-labelledby="form-title" hidden>
      <h2 id="form-title">Adicionar botão</h2>
      <form id="word-form">
        <label for="word">Palavra</label>
        <input id="word" name="word" maxlength="32" required autocomplete="off" placeholder="Ex.: Água">
        <label for="emoji">Símbolo ou emoji</label>
        <input id="emoji" name="emoji" maxlength="8" autocomplete="off" placeholder="Ex.: 💧">
        <div class="form-actions">
          <button type="submit" class="toolbar-button">Salvar botão</button>
          <button type="button" id="cancel-edit" class="toolbar-button secondary-button">Cancelar</button>
        </div>
      </form>
    </section>
    <p class="edit-hint" id="add-hint" hidden>Escolha um botão para editar ou excluir, ou adicione um novo.</p>
    <p class="link-status" id="link-status" aria-live="polite"></p>
    <div class="edit-add-row"><button type="button" id="add-word" class="toolbar-button" hidden>+ Adicionar botão</button></div>
    <div class="buttons" role="list" aria-label="Palavras"></div>
  </main>
  <script src="src/app.js"></script>
</body></html>
